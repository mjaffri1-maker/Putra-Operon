<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Operon Simulator</title>

    <!-- React & ReactDOM (UMD) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone (Pinned to version 7 to fix parsing bugs in v8 alpha) -->
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- html2canvas & jsPDF for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Custom Tailwind Config & CSS -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#09090b',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #09090b;
            color: #e5e7eb;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Drag & Drop Overrides */
        .slot-active { box-shadow: 0 0 20px rgba(99, 102, 241, 0.4) inset; border-color: #6366f1; }

        /* Keyframes for RNAP */
        @keyframes slide-strong {
            0% { left: 0%; opacity: 0; transform: translateX(-50%); }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { left: 100%; opacity: 0; transform: translateX(50%); }
        }

        @keyframes slide-weak {
            0% { left: 0%; opacity: 0; transform: translateX(-50%); }
            5% { opacity: 1; }
            95% { opacity: 1; }
            100% { left: 100%; opacity: 0; transform: translateX(50%); }
        }

        @keyframes bump {
            0% { left: 0%; opacity: 0; transform: translateX(-50%); }
            20% { left: 25%; opacity: 1; transform: translateX(-50%); }
            40% { left: 20%; opacity: 1; transform: translateX(-50%); }
            60% { left: 25%; opacity: 1; transform: translateX(-50%); }
            80% { left: 20%; opacity: 0; transform: translateX(-50%); }
            100% { left: 0%; opacity: 0; transform: translateX(-50%); }
        }

        /* Keyframes for Particles */
        @keyframes float-up {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-150px) scale(1.5); opacity: 0; }
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        /* Animation Classes */
        .rnap-strong { animation: slide-strong 2s linear infinite; }
        .rnap-weak { animation: slide-weak 5.5s linear infinite; }
        .rnap-bump { animation: bump 3s linear infinite; }
        .particle { animation: float-up 2.5s ease-out forwards; position: absolute; }
        .pulse-cap { animation: pulse-glow 2s ease-in-out infinite; }
        
        /* Custom Scrollbar for Parts Library */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const { jsPDF } = window.jspdf;

        // --- DATA DICTIONARY ---
        const PARTS = [
            { id: 'promoter', label: 'Promoter', type: 'promoter', theme: 'blue', icon: 'M5 12h14M12 5l7 7-7 7' },
            { id: 'lac_operator', label: 'Lac Operator', type: 'operator', theme: 'indigo', icon: 'M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z' },
            { id: 'trp_operator', label: 'Trp Operator', type: 'operator', theme: 'purple', icon: 'M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z' },
            { id: 'gene_gfp', label: 'GFP Gene', type: 'gene', theme: 'green', icon: 'M13 10V3L4 14h7v7l9-11h-7z' },
            { id: 'gene_rfp', label: 'RFP Gene', type: 'gene', theme: 'red', icon: 'M13 10V3L4 14h7v7l9-11h-7z' },
            { id: 'gene_lacz', label: 'LacZ Gene', type: 'gene', theme: 'cyan', icon: 'M13 10V3L4 14h7v7l9-11h-7z' },
            { id: 'distractor_1', label: 'Enhancer', type: 'invalid', theme: 'orange', icon: 'M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4' },
            { id: 'distractor_2', label: 'Terminator', type: 'invalid', theme: 'pink', icon: 'M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z' }
        ];

        const THEMES = {
            blue: 'bg-blue-500/10 border-blue-500 text-blue-400 shadow-[0_0_15px_rgba(59,130,246,0.3)]',
            indigo: 'bg-indigo-500/10 border-indigo-500 text-indigo-400 shadow-[0_0_15px_rgba(99,102,241,0.3)]',
            purple: 'bg-purple-500/10 border-purple-500 text-purple-400 shadow-[0_0_15px_rgba(168,85,247,0.3)]',
            green: 'bg-green-500/10 border-green-500 text-green-400 shadow-[0_0_15px_rgba(34,197,94,0.3)]',
            red: 'bg-red-500/10 border-red-500 text-red-400 shadow-[0_0_15px_rgba(239,68,68,0.3)]',
            cyan: 'bg-cyan-500/10 border-cyan-500 text-cyan-400 shadow-[0_0_15px_rgba(6,182,212,0.3)]',
            orange: 'bg-orange-500/10 border-orange-500 text-orange-400 shadow-[0_0_15px_rgba(249,115,22,0.3)]',
            pink: 'bg-pink-500/10 border-pink-500 text-pink-400 shadow-[0_0_15px_rgba(236,72,153,0.3)]',
        };

        const THEMES_PARTICLE = {
            green: 'bg-green-400 shadow-[0_0_10px_rgba(74,222,128,0.8)]',
            red: 'bg-red-400 shadow-[0_0_10px_rgba(248,113,113,0.8)]',
            cyan: 'bg-cyan-400 shadow-[0_0_10px_rgba(34,211,238,0.8)]',
        };

        // --- COMPONENTS ---

        // 1. Particle Emitter for visual feedback of transcription
        const ParticleEmitter = ({ status, geneTheme }) => {
            const [particles, setParticles] = useState([]);
            const nextId = useRef(0);

            useEffect(() => {
                if (status !== 'weak' && status !== 'strong') return;

                const intervalMs = status === 'strong' ? 200 : 700;
                const timer = setInterval(() => {
                    const id = nextId.current++;
                    // Emit particles over the 3rd slot (Gene area: 65% to 90% of track)
                    const left = 70 + Math.random() * 20;
                    setParticles(p => [...p, { id, left }]);

                    setTimeout(() => {
                        setParticles(p => p.filter(x => x.id !== id));
                    }, 2500);
                }, intervalMs);

                return () => clearInterval(timer);
            }, [status]);

            return (
                <div className="absolute inset-0 pointer-events-none overflow-hidden z-20">
                    {particles.map(p => (
                        <div
                            key={p.id}
                            className={`particle w-3 h-3 rounded-full absolute bottom-1/2 ${THEMES_PARTICLE[geneTheme] || 'bg-white'}`}
                            style={{ left: `${p.left}%` }}
                        />
                    ))}
                </div>
            );
        };

        // 2. Main App Component
        const App = () => {
            // State
            const [slots, setSlots] = useState([null, null, null]);
            const [env, setEnv] = useState({ lactose: false, tryptophan: false, glucose: true });
            const [operonName, setOperonName] = useState("");
            const [isPrinting, setIsPrinting] = useState(false);

            // Biological Logic Engine
            const engineState = useMemo(() => {
                if (slots.some(s => s === null)) {
                    return { status: 'incomplete', msg: 'Assemble an operon sequence to begin', color: 'text-gray-400', dot: 'bg-gray-400' };
                }
                const [p, o, g] = slots;
                if (p.type !== 'promoter' || o.type !== 'operator' || g.type !== 'gene') {
                    return { status: 'invalid', msg: 'Invalid Configuration! Order must strictly be Promoter → Operator → Gene', color: 'text-red-400', dot: 'bg-red-400' };
                }

                // Lac Operon Logic (Inducible + Positive Control)
                if (o.id === 'lac_operator') {
                    if (!env.lactose) {
                        return { status: 'blocked', msg: 'Blocked: Repressor binds operator (Lactose OFF)', color: 'text-orange-400', dot: 'bg-orange-400' };
                    }
                    if (env.lactose && env.glucose) {
                        return { status: 'weak', msg: 'Active (Weak): Repressor removed, but low cAMP (no CAP binding)', color: 'text-yellow-400', dot: 'bg-yellow-400' };
                    }
                    if (env.lactose && !env.glucose) {
                        return { status: 'strong', msg: 'Active (Strong): CAP bound (High cAMP) & Repressor removed', color: 'text-green-400', dot: 'bg-green-400' };
                    }
                }

                // Trp Operon Logic (Repressible)
                if (o.id === 'trp_operator') {
                    if (env.tryptophan) {
                        return { status: 'blocked', msg: 'Blocked: Corepressor binds repressor, blocking RNAP (Tryptophan ON)', color: 'text-orange-400', dot: 'bg-orange-400' };
                    }
                    if (!env.tryptophan) {
                        return { status: 'strong', msg: 'Active (Strong): Repressor is inactive. Transcription proceeds freely', color: 'text-green-400', dot: 'bg-green-400' };
                    }
                }

                return { status: 'invalid', msg: 'Unknown biological configuration', color: 'text-red-400', dot: 'bg-red-400' };
            }, [slots, env]);

            // Drag and Drop Handlers
            const handleDragStart = (e, part) => {
                e.dataTransfer.setData('application/json', JSON.stringify(part));
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                e.currentTarget.classList.add('slot-active');
            };

            const handleDragLeave = (e) => {
                e.currentTarget.classList.remove('slot-active');
            };

            const handleDrop = (e, index) => {
                e.preventDefault();
                e.currentTarget.classList.remove('slot-active');
                try {
                    const data = e.dataTransfer.getData('application/json');
                    if (data) {
                        const part = JSON.parse(data);
                        const newSlots = [...slots];
                        newSlots[index] = part;
                        setSlots(newSlots);
                    }
                } catch (err) {
                    console.error("Invalid drop item");
                }
            };

            const clearBoard = () => setSlots([null, null, null]);

            // PDF Export Logic
            const exportPDF = () => {
                setIsPrinting(true);
                // Wait for React to render the print layout
                setTimeout(async () => {
                    try {
                        const element = document.getElementById('print-capture-area');
                        const canvas = await html2canvas(element, { 
                            scale: 2, 
                            backgroundColor: '#09090b',
                            logging: false
                        });
                        const imgData = canvas.toDataURL('image/png');
                        const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
                        
                        const pdfWidth = pdf.internal.pageSize.getWidth();
                        const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                        
                        pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                        pdf.save(`${operonName || 'operon_simulation'}.pdf`);
                    } catch (err) {
                        alert("Failed to generate PDF.");
                        console.error(err);
                    } finally {
                        setIsPrinting(false);
                    }
                }, 300);
            };

            // RNAP Animation mapping
            let rnapClass = '';
            if (engineState.status === 'strong') rnapClass = 'rnap-strong';
            else if (engineState.status === 'weak') rnapClass = 'rnap-weak';
            else if (engineState.status === 'blocked') rnapClass = 'rnap-bump';

            return (
                <div className="min-h-screen flex flex-col items-center py-8 px-4 font-sans selection:bg-indigo-500/30">
                    
                    {/* Main Container */}
                    <div className="w-full max-w-5xl space-y-6">
                        
                        {/* Header */}
                        <header className="text-center space-y-2">
                            <h1 className="text-4xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-400 bg-clip-text text-transparent drop-shadow-sm">
                                Interactive Operon Simulator
                            </h1>
                            {!isPrinting && (
                                <p className="text-gray-400 max-w-2xl mx-auto">
                                    Drag components to construct a functional operon. Toggle environmental factors to observe gene regulation in real-time.
                                </p>
                            )}
                        </header>

                        {/* Diagnostics Panel */}
                        <div className="bg-gray-900/50 backdrop-blur-sm border border-gray-800 rounded-xl p-4 flex items-center shadow-lg">
                            <div className="flex-1 flex items-center space-x-3">
                                <div className={`w-4 h-4 rounded-full shadow-[0_0_10px_currentColor] ${engineState.dot}`}></div>
                                <span className={`font-semibold tracking-wide uppercase text-sm ${engineState.color}`}>
                                    {engineState.status}
                                </span>
                                <span className="text-gray-400 text-sm ml-4 border-l border-gray-700 pl-4">
                                    {engineState.msg}
                                </span>
                            </div>
                        </div>

                        {/* Simulation Canvas / Print Area Wrapper */}
                        <div id="print-capture-area" className="relative bg-gray-900 border border-gray-800 rounded-2xl p-8 overflow-hidden shadow-2xl">
                            
                            {/* Print Header (Visible only during PDF export) */}
                            {isPrinting && (
                                <div className="mb-8 p-6 bg-gray-800/50 rounded-xl border border-gray-700">
                                    <h2 className="text-2xl font-bold text-white mb-4">
                                        Simulation State: {operonName || 'Unnamed Operon'}
                                    </h2>
                                    <div className="flex gap-8 text-lg font-medium text-gray-300">
                                        <div className="flex items-center gap-2">
                                            <div className={`w-3 h-3 rounded-full ${env.lactose ? 'bg-green-400' : 'bg-red-400'}`}></div>
                                            Lactose: {env.lactose ? 'ON' : 'OFF'}
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <div className={`w-3 h-3 rounded-full ${env.tryptophan ? 'bg-green-400' : 'bg-red-400'}`}></div>
                                            Tryptophan: {env.tryptophan ? 'ON' : 'OFF'}
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <div className={`w-3 h-3 rounded-full ${env.glucose ? 'bg-green-400' : 'bg-red-400'}`}></div>
                                            Glucose: {env.glucose ? 'ON' : 'OFF'}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* DNA Backbone Line */}
                            <div className="absolute top-1/2 left-0 w-full h-2 bg-gradient-to-r from-gray-700 via-gray-500 to-gray-700 transform -translate-y-1/2 z-0"></div>
                            <div className="absolute top-1/2 left-4 text-xs font-bold text-gray-500 -translate-y-6">5'</div>
                            <div className="absolute top-1/2 right-4 text-xs font-bold text-gray-500 -translate-y-6">3'</div>

                            {/* Drop Slots Container */}
                            <div className="relative z-10 flex justify-center space-x-12 min-h-[160px] items-center">
                                
                                {slots.map((slotData, idx) => (
                                    <div 
                                        key={idx}
                                        onDragOver={handleDragOver}
                                        onDragLeave={handleDragLeave}
                                        onDrop={(e) => handleDrop(e, idx)}
                                        className="relative w-40 h-28 bg-gray-950/80 border-2 border-dashed border-gray-700 rounded-xl flex items-center justify-center transition-all duration-200"
                                    >
                                        <div className="absolute -top-6 text-xs text-gray-500 uppercase font-bold tracking-wider">
                                            {idx === 0 ? 'Promoter Zone' : idx === 1 ? 'Operator Zone' : 'Gene Zone'}
                                        </div>
                                        
                                        {/* Placed Part */}
                                        {slotData && (
                                            <div className={`w-full h-full rounded-xl border flex flex-col items-center justify-center space-y-2 backdrop-blur-md ${THEMES[slotData.theme]}`}>
                                                <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                                    <path d={slotData.icon} />
                                                </svg>
                                                <span className="font-semibold text-sm">{slotData.label}</span>
                                            </div>
                                        )}

                                        {/* Biological Overlays */}
                                        {/* 1. CAP Protein (Promoter Zone) */}
                                        {idx === 0 && engineState.status === 'strong' && slots[1]?.id === 'lac_operator' && (
                                            <div className="absolute -top-12 w-14 h-12 bg-yellow-400/90 border border-yellow-200 rounded-lg shadow-[0_0_20px_rgba(250,204,21,0.6)] flex items-center justify-center text-yellow-950 font-bold text-xs pulse-cap z-30">
                                                CAP
                                            </div>
                                        )}

                                        {/* 2. Repressor Protein (Operator Zone) */}
                                        {idx === 1 && engineState.status === 'blocked' && (
                                            <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-16 h-16 bg-red-500/90 border-2 border-red-300 rounded shadow-[0_0_20px_rgba(239,68,68,0.6)] flex items-center justify-center text-white font-bold text-xs z-30">
                                                Repressor
                                            </div>
                                        )}
                                    </div>
                                ))}

                            </div>

                            {/* RNA Polymerase Animation */}
                            {rnapClass && (
                                <div className={`absolute top-1/2 transform -translate-y-1/2 z-20 pointer-events-none ${rnapClass}`}>
                                    <div className="w-20 h-10 bg-purple-500 border-2 border-purple-300 rounded-full shadow-[0_0_20px_rgba(168,85,247,0.7)] flex items-center justify-center text-white font-bold text-sm">
                                        RNAP
                                    </div>
                                </div>
                            )}

                            {/* Floating Proteins Emission */}
                            <ParticleEmitter status={engineState.status} geneTheme={slots[2]?.theme} />
                        </div>

                        {/* Interactive Control Center (Hidden during Print) */}
                        {!isPrinting && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                
                                {/* Parts Library */}
                                <div className="md:col-span-2 bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-lg flex flex-col">
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="text-lg font-bold text-gray-200 flex items-center gap-2">
                                            <svg className="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                                            Parts Library
                                        </h3>
                                        <span className="text-xs text-gray-500">Drag items to the canvas</span>
                                    </div>
                                    <div className="flex gap-4 overflow-x-auto pb-2 custom-scrollbar">
                                        {PARTS.map(part => (
                                            <div 
                                                key={part.id}
                                                draggable
                                                onDragStart={(e) => handleDragStart(e, part)}
                                                className={`min-w-[120px] h-24 rounded-lg border cursor-grab active:cursor-grabbing flex flex-col items-center justify-center space-y-1 transition-transform hover:scale-105 ${THEMES[part.theme]}`}
                                            >
                                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                                    <path d={part.icon} />
                                                </svg>
                                                <span className="text-xs font-semibold text-center px-1">{part.label}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Environment & Controls */}
                                <div className="bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-lg flex flex-col space-y-5">
                                    <h3 className="text-lg font-bold text-gray-200 flex items-center gap-2 mb-2">
                                        <svg className="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                                        Environment
                                    </h3>
                                    
                                    {/* Toggles */}
                                    {['lactose', 'tryptophan', 'glucose'].map((factor) => (
                                        <label key={factor} className="flex items-center justify-between cursor-pointer group">
                                            <span className="text-sm font-medium text-gray-300 capitalize group-hover:text-white transition-colors">{factor}</span>
                                            <div className="relative">
                                                <input 
                                                    type="checkbox" 
                                                    className="sr-only" 
                                                    checked={env[factor]}
                                                    onChange={() => setEnv({ ...env, [factor]: !env[factor] })}
                                                />
                                                <div className={`block w-10 h-6 rounded-full transition-colors ${env[factor] ? 'bg-indigo-500' : 'bg-gray-700'}`}></div>
                                                <div className={`absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform ${env[factor] ? 'transform translate-x-4' : ''}`}></div>
                                            </div>
                                        </label>
                                    ))}

                                    <div className="pt-4 border-t border-gray-800 mt-auto">
                                        <button 
                                            onClick={clearBoard}
                                            className="w-full py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-sm font-semibold transition-colors flex items-center justify-center gap-2"
                                        >
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                            Clear Board
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Export Panel (Hidden during Print) */}
                        {!isPrinting && (
                            <div className="bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-lg flex flex-col md:flex-row items-center gap-4 justify-between">
                                <div className="flex-1 w-full">
                                    <label className="block text-xs text-gray-500 font-bold uppercase tracking-wider mb-1">Operon Name</label>
                                    <input 
                                        type="text" 
                                        value={operonName}
                                        onChange={(e) => setOperonName(e.target.value)}
                                        placeholder="e.g. Modified Lac Operon" 
                                        className="w-full bg-gray-950 border border-gray-700 text-gray-200 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                                    />
                                </div>
                                <button 
                                    onClick={exportPDF}
                                    className="w-full md:w-auto px-6 py-2.5 mt-5 md:mt-0 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-semibold transition-all shadow-[0_0_15px_rgba(79,70,229,0.4)] flex items-center justify-center gap-2"
                                >
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                    Download PDF
                                </button>
                            </div>
                        )}

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
