<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operon Simulator - Gene Regulation Lab</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { background-color: #09090b; color: #e5e7eb; }
        
        @keyframes slideAndBlock {
            0% { left: 0%; opacity: 0; }
            10% { opacity: 1; }
            45% { left: 35%; opacity: 1; }
            50% { left: 38%; opacity: 1; }
            55% { left: 38%; opacity: 1; }
            60% { left: 35%; opacity: 1; }
            80% { opacity: 0; }
            100% { left: 35%; opacity: 0; }
        }

        @keyframes slideThrough {
            0% { left: 0%; opacity: 0; transform: translateY(-50%) scale(0.9); }
            10% { opacity: 1; transform: translateY(-50%) scale(1); }
            90% { opacity: 1; transform: translateY(-50%) scale(1); }
            100% { left: 95%; opacity: 0; transform: translateY(-50%) scale(0.9); }
        }

        @keyframes float {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-80px) translateX(30px) scale(1.5); opacity: 0; }
        }

        .animate-polymerase-slide { animation: slideThrough 3s linear infinite; }
        .animate-polymerase-blocked { animation: slideAndBlock 4s linear infinite; }
        .animate-protein-float { animation: float var(--duration, 3s) ease-in infinite; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #18181b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const PARTS_LIBRARY = [
            { id: 'promoter', name: 'Promoter', type: 'promoter', color: 'from-blue-600 to-cyan-500', icon: 'M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z' },
            { id: 'lac_operator', name: 'Lac Operator (Inducible)', type: 'operator', color: 'from-indigo-600 to-violet-500', icon: 'M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z' },
            { id: 'trp_operator', name: 'Trp Operator (Repressible)', type: 'operator', color: 'from-purple-600 to-fuchsia-500', icon: 'M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z' },
            { id: 'gene_gfp', name: 'Gene (GFP Reporter)', type: 'gene', color: 'from-green-500 to-emerald-400', icon: 'M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z' },
            { id: 'gene_rfp', name: 'Gene (RFP Reporter)', type: 'gene', color: 'from-red-500 to-rose-400', icon: 'M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z' },
            { id: 'gene_lacz', name: 'Gene (LacZ Metabolic)', type: 'gene', color: 'from-cyan-600 to-teal-500', icon: 'M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z' },
            { id: 'distractor_1', name: 'Enhancer Element', type: 'invalid', color: 'from-orange-600 to-amber-500', icon: 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z' },
            { id: 'distractor_2', name: 'Amylase Enzyme', type: 'invalid', color: 'from-pink-600 to-pink-400', icon: 'M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z' }
        ];

        function OperonSimulator() {
            const [dnaSlots, setDnaSlots] = useState([null, null, null]);
            const [dragOverIndex, setDragOverIndex] = useState(null);
            const [lactosePresent, setLactosePresent] = useState(false);
            const [tryptophanPresent, setTryptophanPresent] = useState(false);
            const [particles, setParticles] = useState([]);
            const [operonName, setOperonName] = useState('');
            const [isPrinting, setIsPrinting] = useState(false);
            
            let systemStatus = 'incomplete';
            let systemMessage = 'Construct the operon sequence.';
            let isTranscribing = false;
            let repressorBound = false;
            let hasInvalidPart = dnaSlots.some(part => part && part.type === 'invalid');

            const genePresent = dnaSlots[2]?.type === 'gene' ? dnaSlots[2] : null;

            if (hasInvalidPart) {
                systemStatus = 'invalid';
                systemMessage = 'Incompatible part detected. Prokaryotic operons do not use these components.';
            } else if (dnaSlots[0]?.type === 'promoter' && dnaSlots[1]?.type === 'operator' && dnaSlots[2]?.type === 'gene') {
                
                const operatorType = dnaSlots[1].id;

                if (operatorType === 'lac_operator') {
                    if (lactosePresent) {
                        systemStatus = 'active';
                        systemMessage = 'Lactose bound repressor! Transcription ON.';
                        isTranscribing = true;
                    } else {
                        systemStatus = 'blocked';
                        systemMessage = 'Repressor bound to Operator. Transcription BLOCKED.';
                        repressorBound = true;
                    }
                } else if (operatorType === 'trp_operator') {
                    if (tryptophanPresent) {
                        systemStatus = 'blocked';
                        systemMessage = 'Tryptophan bound repressor to Operator! Transcription BLOCKED.';
                        repressorBound = true;
                    } else {
                        systemStatus = 'active';
                        systemMessage = 'Repressor inactive. Transcription ON.';
                        isTranscribing = true;
                    }
                }
            } else if (dnaSlots.some(s => s !== null)) {
                systemStatus = 'incomplete';
                systemMessage = 'Incorrect sequence. Requires: Promoter → Operator → Gene.';
            }

            useEffect(() => {
                let interval;
                if (isTranscribing && genePresent) {
                    interval = setInterval(() => {
                        setParticles(prev => [
                            ...prev.slice(-15),
                            {
                                id: Math.random(),
                                left: 60 + Math.random() * 30,
                                duration: 2 + Math.random() * 2,
                                color: genePresent.id === 'gene_gfp' ? 'bg-emerald-400' : 
                                       genePresent.id === 'gene_rfp' ? 'bg-rose-400' : 'bg-cyan-400'
                            }
                        ]);
                    }, 800);
                } else {
                    setParticles([]);
                }
                return () => clearInterval(interval);
            }, [isTranscribing, genePresent]);

            const handleDragStart = (e, part) => {
                e.dataTransfer.setData('part', JSON.stringify(part));
            };

            const handleDrop = (e, index) => {
                e.preventDefault();
                setDragOverIndex(null);
                try {
                    const part = JSON.parse(e.dataTransfer.getData('part'));
                    const newSlots = [...dnaSlots];
                    newSlots[index] = part;
                    setDnaSlots(newSlots);
                } catch (err) {}
            };

            const removePart = (index) => {
                const newSlots = [...dnaSlots];
                newSlots[index] = null;
                setDnaSlots(newSlots);
            };

            const handleReset = () => {
                setDnaSlots([null, null, null]);
                setLactosePresent(false);
                setTryptophanPresent(false);
                setOperonName('');
            };

            const handleExportPDF = async () => {
                if (!window.html2canvas || !window.jspdf) {
                    alert("PDF Libraries are still loading. Please try again in a moment.");
                    return;
                }
                
                setIsPrinting(true);
                
                setTimeout(async () => {
                    const captureArea = document.getElementById('pdf-capture-area');
                    
                    try {
                        const canvas = await window.html2canvas(captureArea, {
                            scale: 2,
                            backgroundColor: '#09090b',
                            useCORS: true,
                            logging: false
                        });
                        
                        const imgData = canvas.toDataURL('image/png');
                        const { jsPDF } = window.jspdf;
                        
                        const pdf = new jsPDF('l', 'mm', 'a4');
                        const pdfWidth = pdf.internal.pageSize.getWidth();
                        const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                        
                        pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                        pdf.save(`${operonName ? operonName.replace(/[^a-z0-9]/gi, '_') : 'Operon_System'}.pdf`);
                    } catch (error) {
                        console.error("Error generating PDF:", error);
                        alert("Failed to generate PDF.");
                    } finally {
                        setIsPrinting(false);
                    }
                }, 300);
            };

            return (
                <div className="min-h-screen bg-[#09090b] text-gray-200 p-4 md:p-8 font-sans selection:bg-cyan-500/30">
                    <div className="max-w-5xl mx-auto space-y-6">
                        
                        <div id="pdf-capture-area" className="w-full bg-[#09090b] pb-6">
                            
                            {isPrinting && (
                                <div className="flex flex-col items-center justify-center py-6 mb-4 border-b border-zinc-800 w-full bg-[#09090b]">
                                    <h1 className="text-4xl font-bold text-white mb-2">{operonName || 'Custom Operon System'}</h1>
                                    <p className="text-zinc-400">Interactive Operon Builder - Design Report</p>
                                </div>
                            )}

                            {!isPrinting && (
                                <div className="bg-zinc-900/50 backdrop-blur-md border border-zinc-800/80 rounded-2xl p-6 md:p-8 shadow-xl flex flex-col md:flex-row items-center justify-between gap-6">
                                    <div className="flex-1">
                                        <div className="flex items-center gap-3 mb-2">
                                            <div className="h-3 w-3 bg-cyan-500 rounded-full animate-pulse shadow-[0_0_10px_rgba(6,182,212,0.6)]"></div>
                                            <h1 className="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500">
                                                Interactive Operon Builder
                                            </h1>
                                        </div>
                                        
                                        <div className="mt-4 text-zinc-300 text-sm md:text-base leading-relaxed space-y-3 border-l-2 border-zinc-700 pl-4">
                                            <p>
                                                <strong>Design your biological circuit.</strong> An operon is a functioning unit of DNA containing a cluster of genes under the control of a single promoter. 
                                            </p>
                                            <p>
                                                To express a gene, RNA Polymerase must bind to the <strong>Promoter</strong> and slide across the DNA. However, the <strong>Operator</strong> acts as a regulatory switch. Depending on the environment (like the presence of Lactose or Tryptophan), a repressor protein may bind to the operator and physically block transcription.
                                            </p>
                                            <p className="text-cyan-400 font-medium">
                                                Drag parts from the library into the 5' → 3' slots to build and test your construct!
                                            </p>
                                        </div>
                                    </div>
                                    <div className="hidden md:block opacity-70">
                                        <svg width="120" height="120" viewBox="0 0 100 100">
                                            <path d="M 20 20 Q 50 50 80 20" stroke="url(#cyan-grad)" strokeWidth="4" fill="transparent" />
                                            <path d="M 20 80 Q 50 50 80 80" stroke="url(#fuchsia-grad)" strokeWidth="4" fill="transparent" />
                                            <line x1="30" y1="30" x2="30" y2="70" stroke="#3f3f46" strokeWidth="2" />
                                            <line x1="50" y1="48" x2="50" y2="52" stroke="#3f3f46" strokeWidth="2" />
                                            <line x1="70" y1="30" x2="70" y2="70" stroke="#3f3f46" strokeWidth="2" />
                                            <defs>
                                                <linearGradient id="cyan-grad" x1="0" y1="0" x2="1" y2="0">
                                                    <stop offset="0%" stopColor="#22d3ee" />
                                                    <stop offset="100%" stopColor="#3b82f6" />
                                                </linearGradient>
                                                <linearGradient id="fuchsia-grad" x1="0" y1="0" x2="1" y2="0">
                                                    <stop offset="0%" stopColor="#e879f9" />
                                                    <stop offset="100%" stopColor="#d946ef" />
                                                </linearGradient>
                                            </defs>
                                        </svg>
                                    </div>
                                </div>
                            )}

                            <div className={`mt-6 p-5 rounded-xl border flex items-center gap-4 shadow-lg transition-all duration-300 backdrop-blur-md
                                ${systemStatus === 'active' ? 'bg-emerald-950/40 border-emerald-500/50 shadow-[0_0_20px_rgba(16,185,129,0.15)]' : 
                                systemStatus === 'blocked' ? 'bg-red-950/40 border-red-500/50' : 
                                systemStatus === 'invalid' ? 'bg-orange-950/40 border-orange-500/50' : 
                                'bg-zinc-900/50 border-zinc-800'}`}
                            >
                                <div className={`w-4 h-4 rounded-full flex-shrink-0 ${
                                    systemStatus === 'active' ? 'bg-emerald-400 shadow-[0_0_10px_rgba(52,211,153,0.8)]' : 
                                    systemStatus === 'blocked' ? 'bg-red-500' : 
                                    systemStatus === 'invalid' ? 'bg-orange-500' : 
                                    'bg-zinc-600'
                                }`}></div>
                                <div>
                                    <h3 className="font-bold text-sm tracking-wider text-zinc-400 uppercase">System Diagnostics</h3>
                                    <p className={`font-medium ${
                                        systemStatus === 'active' ? 'text-emerald-300' : 
                                        systemStatus === 'blocked' ? 'text-red-300' : 
                                        systemStatus === 'invalid' ? 'text-orange-300' : 
                                        'text-zinc-300'
                                    }`}>{systemMessage}</p>
                                </div>
                            </div>

                            <div className="mt-6 w-full bg-zinc-900/40 backdrop-blur-xl border border-zinc-800/80 rounded-2xl p-8 relative overflow-hidden flex flex-col justify-center min-h-[350px]">
                                
                                {particles.map(p => (
                                    <div 
                                        key={p.id} 
                                        className={`absolute bottom-[40%] w-4 h-4 rounded-full animate-protein-float blur-[1px] shadow-[0_0_10px_currentColor] ${p.color}`}
                                        style={{ left: `${p.left}%`, '--duration': `${p.duration}s` }}
                                    ></div>
                                ))}

                                {(isTranscribing || repressorBound) && (
                                    <div className={`absolute top-1/2 -translate-y-1/2 w-16 h-12 bg-zinc-200 rounded-full z-20 flex items-center justify-center opacity-90 shadow-[0_0_15px_rgba(255,255,255,0.4)]
                                        ${isTranscribing ? 'animate-polymerase-slide' : 'animate-polymerase-blocked'}`}
                                    >
                                        <span className="text-[10px] font-bold text-zinc-800 text-center leading-none">RNA<br/>Pol</span>
                                    </div>
                                )}

                                {repressorBound && (
                                    <div className="absolute top-1/2 left-[45%] -translate-y-1/2 -translate-x-1/2 w-14 h-16 bg-red-500/90 rounded-lg z-10 flex items-center justify-center shadow-[0_0_20px_rgba(239,68,68,0.5)] border-2 border-red-400">
                                        <span className="text-[10px] font-bold text-white text-center">Repressor</span>
                                    </div>
                                )}

                                <div className="relative flex items-center justify-center w-full max-w-3xl mx-auto">
                                    <div className="absolute w-full h-3 bg-zinc-800 rounded-full border-y border-zinc-700"></div>
                                    
                                    <div className="text-cyan-300 font-bold text-xl md:text-2xl font-mono shrink-0 z-10 px-2 py-1 bg-[#09090b]/80 rounded-lg backdrop-blur-md border border-cyan-500/50 shadow-[0_0_15px_rgba(34,211,238,0.4)]">
                                        5'
                                    </div>
                                    
                                    <div className="flex gap-4 z-10 mx-6 w-full justify-center">
                                        {dnaSlots.map((slot, index) => (
                                            <div 
                                                key={index}
                                                onDragOver={(e) => { e.preventDefault(); setDragOverIndex(index); }}
                                                onDragLeave={() => setDragOverIndex(null)}
                                                onDrop={(e) => handleDrop(e, index)}
                                                onClick={() => slot && removePart(index)}
                                                className={`h-28 w-1/3 max-w-[180px] rounded-xl border-2 border-dashed flex flex-col items-center justify-center transition-all cursor-pointer backdrop-blur-sm
                                                    ${dragOverIndex === index ? 'bg-cyan-900/30 border-cyan-400 shadow-[0_0_15px_rgba(34,211,238,0.3)] scale-105' : 
                                                    slot ? 'border-transparent border-none' : 'border-zinc-700 bg-zinc-900/50 hover:border-zinc-500'}`}
                                            >
                                                {slot ? (
                                                    <div className={`w-full h-full bg-gradient-to-br ${slot.color} rounded-xl flex flex-col items-center justify-center text-white shadow-lg relative group border border-white/20`}>
                                                        <svg className="w-8 h-8 mb-2 opacity-80" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d={slot.icon} />
                                                        </svg>
                                                        <span className="font-bold text-sm text-center px-1 leading-tight">{slot.name}</span>
                                                        {!isPrinting && (
                                                            <div className="absolute inset-0 bg-black/60 rounded-xl opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
                                                                <span className="text-xs font-bold text-white uppercase tracking-wider">Remove</span>
                                                            </div>
                                                        )}
                                                    </div>
                                                ) : (
                                                    <span className="text-zinc-500 font-medium text-sm">Slot {index + 1}</span>
                                                )}
                                            </div>
                                        ))}
                                    </div>

                                    <div className="text-fuchsia-300 font-bold text-xl md:text-2xl font-mono shrink-0 z-10 px-2 py-1 bg-[#09090b]/80 rounded-lg backdrop-blur-md border border-fuchsia-500/50 shadow-[0_0_15px_rgba(232,121,249,0.4)]">
                                        3'
                                    </div>
                                </div>
                            </div>

                            {isPrinting && (
                                <div className="grid grid-cols-2 gap-6 w-full mt-6 bg-[#09090b]">
                                    <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-5 flex items-center justify-between">
                                        <div>
                                            <h3 className="font-bold text-cyan-400">Lactose (Inducer)</h3>
                                            <p className="text-zinc-400 text-sm">Status in Environment</p>
                                        </div>
                                        <span className={`px-4 py-2 rounded-lg font-bold ${lactosePresent ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/50' : 'bg-zinc-800 text-zinc-500 border border-zinc-700'}`}>
                                            {lactosePresent ? 'PRESENT' : 'ABSENT'}
                                        </span>
                                    </div>
                                    <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-5 flex items-center justify-between">
                                        <div>
                                            <h3 className="font-bold text-amber-400">Tryptophan (Corepressor)</h3>
                                            <p className="text-zinc-400 text-sm">Status in Environment</p>
                                        </div>
                                        <span className={`px-4 py-2 rounded-lg font-bold ${tryptophanPresent ? 'bg-amber-500/20 text-amber-300 border border-amber-500/50' : 'bg-zinc-800 text-zinc-500 border border-zinc-700'}`}>
                                            {tryptophanPresent ? 'PRESENT' : 'ABSENT'}
                                        </span>
                                    </div>
                                </div>
                            )}

                        </div>

                        {!isPrinting && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                
                                <div className="lg:col-span-2 bg-zinc-900/50 backdrop-blur-md border border-zinc-800/80 rounded-2xl p-6 shadow-xl">
                                    <h2 className="text-xl font-semibold mb-4 text-gray-100 flex items-center gap-2">
                                        <svg className="w-5 h-5 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                                        </svg>
                                        Parts Library
                                    </h2>
                                    <div className="flex gap-3 overflow-x-auto pb-4 pt-2 px-2">
                                        {PARTS_LIBRARY.map(part => (
                                            <div 
                                                key={part.id}
                                                draggable
                                                onDragStart={(e) => handleDragStart(e, part)}
                                                className={`min-w-[120px] h-28 bg-gradient-to-br ${part.color} rounded-xl flex flex-col items-center justify-center text-white cursor-grab active:cursor-grabbing hover:-translate-y-2 hover:shadow-xl transition-all shadow-md border border-white/20 hover:shadow-[0_0_15px_currentColor]`}
                                            >
                                                <svg className="w-6 h-6 mb-2 opacity-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d={part.icon} />
                                                </svg>
                                                <span className="font-semibold text-xs text-center px-2 leading-tight">{part.name}</span>
                                            </div>
                                        ))}
                                    </div>
                                    <p className="text-zinc-500 text-xs mt-2 italic text-center">Drag parts onto the DNA slots above.</p>
                                </div>

                                <div className="bg-zinc-900/50 backdrop-blur-md border border-zinc-800/80 rounded-2xl p-6 shadow-xl flex flex-col">
                                    <h2 className="text-xl font-semibold mb-6 text-gray-100 flex items-center gap-2">
                                        <svg className="w-5 h-5 text-fuchsia-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                                        </svg>
                                        Environment
                                    </h2>
                                    
                                    <div className="space-y-4 flex-1">
                                        <div className="flex items-center justify-between p-3 bg-zinc-950/50 rounded-xl border border-zinc-800">
                                            <div className="flex flex-col">
                                                <span className="font-semibold text-cyan-400">Lactose</span>
                                                <span className="text-xs text-zinc-500">Inducer molecule</span>
                                            </div>
                                            <button 
                                                onClick={() => setLactosePresent(!lactosePresent)}
                                                className={`w-14 h-8 rounded-full p-1 transition-colors relative shadow-inner ${lactosePresent ? 'bg-cyan-500' : 'bg-zinc-700'}`}
                                            >
                                                <div className={`w-6 h-6 bg-white rounded-full transition-transform shadow-md ${lactosePresent ? 'translate-x-6' : 'translate-x-0'}`}></div>
                                            </button>
                                        </div>

                                        <div className="flex items-center justify-between p-3 bg-zinc-950/50 rounded-xl border border-zinc-800">
                                            <div className="flex flex-col">
                                                <span className="font-semibold text-amber-400">Tryptophan</span>
                                                <span className="text-xs text-zinc-500">Corepressor molecule</span>
                                            </div>
                                            <button 
                                                onClick={() => setTryptophanPresent(!tryptophanPresent)}
                                                className={`w-14 h-8 rounded-full p-1 transition-colors relative shadow-inner ${tryptophanPresent ? 'bg-amber-500' : 'bg-zinc-700'}`}
                                            >
                                                <div className={`w-6 h-6 bg-white rounded-full transition-transform shadow-md ${tryptophanPresent ? 'translate-x-6' : 'translate-x-0'}`}></div>
                                            </button>
                                        </div>
                                    </div>

                                    <button 
                                        onClick={handleReset}
                                        className="w-full py-3 bg-red-950/30 hover:bg-red-900/40 text-red-400 rounded-xl font-semibold transition-all border border-red-900/50 text-sm mt-4 shadow-sm"
                                    >
                                        Clear Sandbox
                                    </button>
                                </div>
                            </div>
                        )}
                        
                        {!isPrinting && (
                            <div className="bg-zinc-900/50 backdrop-blur-md border border-zinc-800/80 rounded-2xl p-6 shadow-xl">
                                <h2 className="text-xl font-semibold mb-4 text-gray-100 flex items-center gap-2">
                                    <svg className="w-5 h-5 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                    </svg>
                                    Export Operon Report
                                </h2>
                                <div className="flex flex-col md:flex-row gap-4 items-end">
                                    <div className="flex-1 w-full">
                                        <label className="block text-sm font-medium text-zinc-400 mb-2">Operon Name (Used as PDF Title)</label>
                                        <input 
                                            type="text" 
                                            value={operonName}
                                            onChange={(e) => setOperonName(e.target.value)}
                                            placeholder="e.g., Tryptophan Biosensor Alpha"
                                            className="w-full bg-zinc-950/50 border border-zinc-700/50 rounded-xl px-4 py-3 text-gray-200 focus:outline-none focus:border-cyan-500 transition-colors placeholder:text-zinc-600"
                                        />
                                    </div>
                                    <button 
                                        onClick={handleExportPDF}
                                        disabled={isPrinting}
                                        className="w-full md:w-auto px-8 py-3 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white rounded-xl font-bold transition-all shadow-[0_0_15px_rgba(34,211,238,0.3)] hover:shadow-[0_0_25px_rgba(34,211,238,0.5)] flex items-center justify-center gap-2 whitespace-nowrap disabled:opacity-50"
                                    >
                                        {isPrinting ? 'Generating...' : 'Download PDF'}
                                    </button>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OperonSimulator />);
    </script>
</body>
</html>
