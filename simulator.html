<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operon Simulator - Gene Regulation Lab</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { background-color: #09090b; color: #e5e7eb; font-family: sans-serif; }
        
        @keyframes slideAndBlock {
            0% { left: 0%; opacity: 0; }
            10% { opacity: 1; }
            45% { left: 35%; opacity: 1; }
            50% { left: 38%; opacity: 1; }
            55% { left: 38%; opacity: 1; }
            60% { left: 35%; opacity: 1; }
            80% { opacity: 0; }
            100% { left: 35%; opacity: 0; }
        }

        @keyframes slideThrough {
            0% { left: 0%; opacity: 0; transform: translateY(-50%) scale(0.9); }
            10% { opacity: 1; transform: translateY(-50%) scale(1); }
            90% { opacity: 1; transform: translateY(-50%) scale(1); }
            100% { left: 95%; opacity: 0; transform: translateY(-50%) scale(0.9); }
        }

        @keyframes float {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-80px) translateX(30px) scale(1.5); opacity: 0; }
        }

        @keyframes pulse-cap {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .animate-polymerase-fast { animation: slideThrough 2s linear infinite; }
        .animate-polymerase-slow { animation: slideThrough 5.5s linear infinite; }
        .animate-polymerase-blocked { animation: slideAndBlock 4s linear infinite; }
        .animate-protein-float { animation: float var(--duration, 3s) ease-in infinite; }
        .animate-cap-bind { animation: pulse-cap 2s ease-in-out infinite; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #18181b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const PARTS_LIBRARY = [
            { id: 'promoter', name: 'Promoter', type: 'promoter', color: 'from-blue-600 to-cyan-500', icon: 'M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z' },
            { id: 'lac_operator', name: 'Lac Operator', type: 'operator', color: 'from-indigo-600 to-violet-500', icon: 'M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z' },
            { id: 'trp_operator', name: 'Trp Operator', type: 'operator', color: 'from-purple-600 to-fuchsia-500', icon: 'M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z' },
            { id: 'gene_gfp', name: 'Gene (GFP)', type: 'gene', color: 'from-green-500 to-emerald-400', icon: 'M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z' },
            { id: 'gene_rfp', name: 'Gene (RFP)', type: 'gene', color: 'from-red-500 to-rose-400', icon: 'M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z' },
            { id: 'gene_lacz', name: 'Gene (LacZ)', type: 'gene', color: 'from-cyan-600 to-teal-500', icon: 'M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z' },
            { id: 'distractor_1', name: 'Enhancer Element', type: 'invalid', color: 'from-orange-600 to-amber-500', icon: 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z' },
            { id: 'distractor_2', name: 'Amylase Enzyme', type: 'invalid', color: 'from-pink-600 to-pink-400', icon: 'M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z' }
        ];

        function App() {
            const [slots, setSlots] = useState([null, null, null]);
            const [dragIdx, setDragIdx] = useState(null);
            const [env, setEnv] = useState({ lactose: false, tryptophan: false, glucose: true });
            const [particles, setParticles] = useState([]);
            const [exportName, setExportName] = useState('');
            const [isPrinting, setIsPrinting] = useState(false);
            
            let status = 'incomplete';
            let message = 'Construct the operon sequence.';
            let isRunning = false;
            let hasRepressor = false;
            let hasCap = false;
            let speed = 'none';
            let hasInvalid = slots.some(part => part && part.type === 'invalid');
            const targetGene = slots[2]?.type === 'gene' ? slots[2] : null;

            if (hasInvalid) {
                status = 'invalid';
                message = 'Incompatible part detected. Prokaryotic operons do not use these components.';
            } else if (slots[0]?.type === 'promoter' && slots[1]?.type === 'operator' && slots[2]?.type === 'gene') {
                const opType = slots[1].id;
                if (opType === 'lac_operator') {
                    if (env.lactose) {
                        if (!env.glucose) {
                            status = 'active-strong';
                            message = 'Lactose present & High cAMP. CAP bound to promoter. Transcription is STRONG!';
                            isRunning = true;
                            speed = 'strong';
                            hasCap = true;
                        } else {
                            status = 'active-weak';
                            message = 'Lactose present, but High Glucose (Low cAMP) keeps CAP inactive. Transcription is WEAK.';
                            isRunning = true;
                            speed = 'weak';
                        }
                    } else {
                        status = 'blocked';
                        message = 'Repressor bound to Operator. Transcription BLOCKED.';
                        hasRepressor = true;
                    }
                } else if (opType === 'trp_operator') {
                    if (env.tryptophan) {
                        status = 'blocked';
                        message = 'Tryptophan bound repressor to Operator! Transcription BLOCKED.';
                        hasRepressor = true;
                    } else {
                        status = 'active-strong';
                        message = 'Repressor inactive. Transcription ON.';
                        isRunning = true;
                        speed = 'strong';
                    }
                }
            } else if (slots.some(s => s !== null)) {
                status = 'incomplete';
                message = 'Incorrect sequence. Requires: Promoter → Operator → Gene.';
            }

            useEffect(() => {
                let interval;
                if (isRunning && targetGene) {
                    const rate = speed === 'strong' ? 350 : 1800;
                    interval = setInterval(() => {
                        setParticles(prev => [...prev.slice(-15), {
                            id: Math.random(),
                            left: 60 + Math.random() * 30,
                            duration: 2 + Math.random() * 2,
                            color: targetGene.id === 'gene_gfp' ? 'bg-emerald-400' : 
                                   targetGene.id === 'gene_rfp' ? 'bg-rose-400' : 'bg-cyan-400'
                        }]);
                    }, rate);
                } else {
                    setParticles([]);
                }
                return () => clearInterval(interval);
            }, [isRunning, targetGene, speed]);

            const handleDragStart = (e, part) => { e.dataTransfer.setData('part', JSON.stringify(part)); };
            const handleDrop = (e, index) => {
                e.preventDefault();
                setDragIdx(null);
                try {
                    const part = JSON.parse(e.dataTransfer.getData('part'));
                    const newSlots = [...slots];
                    newSlots[index] = part;
                    setSlots(newSlots);
                } catch (err) {}
            };

            const toggleEnv = (key) => { setEnv(prev => ({ ...prev, [key]: !prev[key] })); };
            const resetBoard = () => { setSlots([null, null, null]); setEnv({ lactose: false, tryptophan: false, glucose: true }); };

            const triggerPDF = () => {
                if (!window.html2canvas || !window.jspdf) { alert("Libraries loading. Try again in a moment."); return; }
                setIsPrinting(true);
                setTimeout(async () => {
                    try {
                        const canvas = await window.html2canvas(document.getElementById('pdf-area'), { scale: 2, backgroundColor: '#09090b', logging: false });
                        const { jsPDF } = window.jspdf;
                        const pdf = new jsPDF('l', 'mm', 'a4');
                        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, pdf.internal.pageSize.getWidth(), (canvas.height * pdf.internal.pageSize.getWidth()) / canvas.width);
                        pdf.save(`${exportName ? exportName.replace(/[^a-z0-9]/gi, '_') : 'Operon_System'}.pdf`);
                    } catch (err) { alert("Failed to export."); } 
                    finally { setIsPrinting(false); }
                }, 300);
            };

            const statusColors = {
                'active-strong': 'bg-emerald-950/40 border-emerald-500/50 text-emerald-300',
                'active-weak': 'bg-lime-950/40 border-lime-500/50 text-lime-300',
                'blocked': 'bg-red-950/40 border-red-500/50 text-red-300',
                'invalid': 'bg-orange-950/40 border-orange-500/50 text-orange-300',
                'incomplete': 'bg-zinc-900/50 border-zinc-800 text-zinc-300'
            };

            return (
                <div className="min-h-screen bg-[#09090b] text-gray-200 p-4 md:p-8 font-sans selection:bg-cyan-500/30">
                    <div className="max-w-5xl mx-auto space-y-6">
                        
                        {/* Simulation Area (Captured for PDF) */}
                        <div id="pdf-area" className="w-full bg-[#09090b] pb-6">
                            {isPrinting ? (
                                <div className="flex flex-col items-center justify-center py-6 mb-4 border-b border-zinc-800 w-full bg-[#09090b]">
                                    <h1 className="text-4xl font-bold text-white mb-2">{exportName || 'Custom Operon System'}</h1>
                                    <p className="text-zinc-400">Interactive Operon Builder - Design Report</p>
                                </div>
                            ) : (
                                <div className="bg-zinc-900/50 backdrop-blur-md border border-zinc-800/80 rounded-2xl p-6 shadow-xl flex flex-col md:flex-row items-center gap-6">
                                    <div className="flex-1">
                                        <div className="flex items-center gap-3 mb-2">
                                            <div className="h-3 w-3 bg-cyan-500 rounded-full animate-pulse shadow-[0_0_10px_rgba(6,182,212,0.6)]"></div>
                                            <h1 className="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500">Interactive Operon Builder</h1>
                                        </div>
                                        <div className="mt-4 text-zinc-300 text-sm leading-relaxed space-y-2 border-l-2 border-zinc-700 pl-4">
                                            <p>Design your biological circuit. Drag components into the slots below.</p>
                                        </div>
                                    </div>
                                </div>
                            )}

                            <div className={`mt-6 p-5 rounded-xl border flex items-center gap-4 shadow-lg ${statusColors[status]}`}>
                                <div>
                                    <h3 className="font-bold text-sm uppercase opacity-80">System Diagnostics</h3>
                                    <p className="font-medium mt-1">{message}</p>
                                </div>
                            </div>

                            <div className="mt-6 w-full bg-zinc-900/40 border border-zinc-800/80 rounded-2xl p-8 relative overflow-hidden flex flex-col justify-center min-h-[350px]">
                                {particles.map(p => (
                                    <div key={p.id} className={`absolute bottom-[40%] w-4 h-4 rounded-full animate-protein-float blur-[1px] ${p.color}`} style={{ left: `${p.left}%`, '--duration': `${p.duration}s` }}></div>
                                ))}

                                {(isRunning || hasRepressor) && (
                                    <div className={`absolute top-1/2 -translate-y-1/2 w-16 h-12 bg-zinc-200 rounded-full z-20 flex items-center justify-center opacity-90 shadow-[0_0_15px_rgba(255,255,255,0.4)] ${speed === 'strong' ? 'animate-polymerase-fast' : speed === 'weak' ? 'animate-polymerase-slow' : 'animate-polymerase-blocked'}`}>
                                        <span className="text-[10px] font-bold text-zinc-800 text-center leading-none">RNA<br/>Pol</span>
                                    </div>
                                )}

                                {hasRepressor && (
                                    <div className="absolute top-1/2 left-[45%] -translate-y-1/2 -translate-x-1/2 w-14 h-16 bg-red-500/90 rounded-lg z-10 flex items-center justify-center shadow-[0_0_20px_rgba(239,68,68,0.5)] border-2 border-red-400">
                                        <span className="text-[10px] font-bold text-white text-center">Repressor</span>
                                    </div>
                                )}

                                <div className="relative flex items-center justify-center w-full max-w-3xl mx-auto">
                                    <div className="absolute w-full h-3 bg-zinc-800 rounded-full border-y border-zinc-700"></div>
                                    
                                    <div className="text-cyan-300 font-bold text-xl font-mono shrink-0 z-10 px-2 py-1 bg-[#09090b]/80 rounded-lg border border-cyan-500/50">5'</div>
                                    
                                    <div className="flex gap-4 z-10 mx-6 w-full justify-center">
                                        {slots.map((slot, i) => (
                                            <div key={i} onDragOver={(e) => { e.preventDefault(); setDragIdx(i); }} onDragLeave={() => setDragIdx(null)} onDrop={(e) => handleDrop(e, i)} onClick={() => slot && setSlots(slots.map((s, idx) => idx === i ? null : s))} className={`h-28 w-1/3 max-w-[180px] relative rounded-xl border-2 border-dashed flex flex-col items-center justify-center cursor-pointer ${dragIdx === i ? 'bg-cyan-900/30 border-cyan-400' : slot ? 'border-transparent border-none' : 'border-zinc-700 bg-zinc-900/50 hover:border-zinc-500'}`}>
                                                {i === 0 && hasCap && slot && slot.id === 'promoter' && (
                                                    <div className="absolute -top-5 -left-3 w-14 h-14 bg-amber-400 rounded-full z-30 flex items-center justify-center shadow-[0_0_20px_rgba(251,191,36,0.6)] border-2 border-amber-200 animate-cap-bind">
                                                        <span className="text-[10px] font-bold text-amber-950 text-center">CAP</span>
                                                    </div>
                                                )}
                                                {slot ? (
                                                    <div className={`w-full h-full bg-gradient-to-br ${slot.color} rounded-xl flex flex-col items-center justify-center text-white relative group`}>
                                                        <svg className="w-8 h-8 mb-2 opacity-80" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d={slot.icon} /></svg>
                                                        <span className="font-bold text-sm text-center px-1 leading-tight">{slot.name}</span>
                                                        {!isPrinting && <div className="absolute inset-0 bg-black/60 rounded-xl opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity"><span className="text-xs font-bold text-white uppercase">Remove</span></div>}
                                                    </div>
                                                ) : <span className="text-zinc-500 text-sm">Slot {i + 1}</span>}
                                            </div>
                                        ))}
                                    </div>

                                    <div className="text-fuchsia-300 font-bold text-xl font-mono shrink-0 z-10 px-2 py-1 bg-[#09090b]/80 rounded-lg border border-fuchsia-500/50">3'</div>
                                </div>
                            </div>

                            {isPrinting && (
                                <div className="grid grid-cols-3 gap-4 w-full mt-6 bg-[#09090b]">
                                    {Object.entries(env).map(([k, v]) => (
                                        <div key={k} className="bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex flex-col items-center text-center">
                                            <h3 className="font-bold text-zinc-300 capitalize mb-2">{k}</h3>
                                            <span className={`px-4 py-1 rounded-lg font-bold text-sm ${v ? 'bg-cyan-500/20 text-cyan-300' : 'bg-zinc-800 text-zinc-500'}`}>{v ? 'HIGH/PRESENT' : 'LOW/ABSENT'}</span>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* Controls (Hidden During Print) */}
                        {!isPrinting && (
                            <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                                <div className="lg:col-span-3 bg-zinc-900/50 border border-zinc-800/80 rounded-2xl p-6 flex flex-col">
                                    <h2 className="text-xl font-semibold mb-4 text-gray-100">Parts Library</h2>
                                    <div className="flex gap-3 overflow-x-auto pb-4 pt-2">
                                        {PARTS_LIBRARY.map(part => (
                                            <div key={part.id} draggable onDragStart={(e) => handleDragStart(e, part)} className={`min-w-[120px] h-28 bg-gradient-to-br ${part.color} rounded-xl flex flex-col items-center justify-center text-white cursor-grab active:cursor-grabbing hover:-translate-y-2 transition-all`}>
                                                <svg className="w-6 h-6 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d={part.icon} /></svg>
                                                <span className="font-semibold text-xs text-center px-2">{part.name}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-zinc-900/50 border border-zinc-800/80 rounded-2xl p-6 flex flex-col space-y-4">
                                    <h2 className="text-xl font-semibold mb-2 text-gray-100">Environment</h2>
                                    {[
                                        { id: 'lactose', color: 'cyan' },
                                        { id: 'tryptophan', color: 'amber' },
                                        { id: 'glucose', color: 'emerald' }
                                    ].map(item => (
                                        <div key={item.id} className="flex items-center justify-between p-3 bg-zinc-950/50 rounded-xl border border-zinc-800">
                                            <span className={`font-semibold capitalize text-${item.color}-400`}>{item.id}</span>
                                            <button onClick={() => toggleEnv(item.id)} className={`w-12 h-6 rounded-full p-1 transition-colors ${env[item.id] ? `bg-${item.color}-500` : 'bg-zinc-700'}`}>
                                                <div className={`w-4 h-4 bg-white rounded-full transition-transform ${env[item.id] ? 'translate-x-6' : 'translate-x-0'}`}></div>
                                            </button>
                                        </div>
                                    ))}
                                    <button onClick={resetBoard} className="w-full py-2 bg-red-900/30 text-red-400 rounded-xl font-semibold mt-auto">Clear Board</button>
                                </div>
                            </div>
                        )}
                        
                        {!isPrinting && (
                            <div className="bg-zinc-900/50 border border-zinc-800/80 rounded-2xl p-6 flex flex-col md:flex-row gap-4 items-end">
                                <div className="flex-1 w-full">
                                    <label className="block text-sm text-zinc-400 mb-2">Operon Name (PDF Title)</label>
                                    <input type="text" value={exportName} onChange={(e) => setExportName(e.target.value)} className="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-4 py-3 focus:outline-none focus:border-cyan-500" />
                                </div>
                                <button onClick={triggerPDF} className="px-8 py-3 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl font-bold">Download PDF</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
